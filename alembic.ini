# Alembic migrations for the Postgres store (engine/db). The database URL comes from
# DATABASE_URL (default: the docker compose `db` service on localhost:5432).
#
#   .venv/bin/alembic upgrade head
#   .venv/bin/alembic revision --autogenerate -m "describe the change"

[alembic]
script_location = %(here)s/engine/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
