server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # bundles are ~2 MB of JSON; they compress ~10x
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Data comes from Postgres: the compose `api` service serves the same manifest.json and
    # <source>/bundle.json the exporter writes. Never fall back to index.html -- a missing
    # bundle must be a 404 and a down api a JSON 503; HTML here would surface as
    # "Unexpected token '<'" instead of a clear error. The variable + Docker's resolver let
    # nginx start (and recover) even while the api container is still coming up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /data/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_intercept_errors on;
        error_page 502 503 504 = @data_unavailable;
        gzip_proxied any;
    }
    location @data_unavailable {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        return 503 '{"error":"data service unavailable"}';
    }

    # Content-hashed build assets: cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: every route (/real/cardiologists/123, …) renders the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
