server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # bundles are ~2 MB of JSON; they compress ~10x
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Data bundles: never fall back to index.html. A missing bundle must be a 404 --
    # serving HTML here would surface as "Unexpected token '<'" instead of a clear error.
    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Content-hashed build assets: cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: every route (/real/cardiologists/123, …) renders the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
